name: Claude commit review
on: push
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Review the commit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git show --stat --patch HEAD | head -c 150000 > commit.diff
          claude -p "You are reviewing the git commit provided on stdin. Write a short review in Markdown with these sections: Summary (what changed), Possible bugs, Security concerns, Code quality and suggestions, Commit message quality. Be specific and mention file names and lines. If a section has nothing, write 'None found'." < commit.diff > review.md
          cat review.md

      - name: Post review as a commit comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@review.md


